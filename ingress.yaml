apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  # FIX: Hardcodes your UI as the default handler, stopping the GKE 404 lookup loop
  defaultBackend:
    service:
      name: ui-service
      port:
        number: 80
  rules:
  - http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: ui-service
            port:
              number: 80
      
      - path: /api/products/*
        pathType: ImplementationSpecific
        backend:
          service:
            name: api-3-service
            port:
              number: 80

      - path: /api/write/*
        pathType: ImplementationSpecific
        backend:
          service:
            name: api-2-service
            port:
              number: 80

      - path: /api/read/*
        pathType: ImplementationSpecific
        backend:
          service:
            name: api-1-service
            port:
              number: 80
