apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # rewrite-target strips the "/api" prefix before passing the request to the microservice
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
  - http:
      paths:
      # 1. Routing to your Frontend App
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service  # Match your frontend K8s service name
            port:
              number: 80
      
      # 2. Routing to the Products Microservice
      - path: /api/products()(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: products-service  # Match your product microservice backend service name
            port:
              number: 80

      # 3. Routing to the Write API
      - path: /api/write()(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: write-api-service  # Match your write backend service name
            port:
              number: 80

      # 4. Routing to the Read API
      - path: /api/read()(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: read-api-service   # Match your read backend service name
            port:
              number: 80
