<!DOCTYPE html>
<html>
<head>
    <title>Dockerized App Interface</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; background-color: #f4f7f6; color: #333; }
        h2 { border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        
        /* Layout Containers */
        .box { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* Step 1 & 2 Styling */
        input[type="text"] { padding: 10px; width: 250px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 20px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; transition: 0.3s; }
        button:hover { background-color: #0056b3; }

        /* --- NEW: PRODUCT GRID CSS --- */
        #product-grid {
            display: grid;
            /* Creates as many columns as fit, at least 250px wide each */
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .product-card img { max-width: 100%; height: 150px; object-fit: cover; border-radius: 5px; }
        .price { color: #28a745; font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>

    <div class="box">
        <h3>Step 1: POST Data (API 1)</h3>
        <input type="text" id="userInput" placeholder="Type something here...">
        <button onclick="sendData()">Save to Memory</button>
    </div>

    <div class="box">
        <h3>Step 2: GET Data (API 2)</h3>
        <button onclick="getData()">Refresh List</button>
        <ul id="list"></ul>
    </div>

    <!-- NEW SECTION: PRODUCT CATALOG -->
    <div class="box">
        <h3>Step 3: Dynamic Product Catalog (API 3)</h3>
        <p>This section fetches data from your product microservice.</p>
        <div id="product-grid">
            <!-- Dynamic boxes will appear here -->
        </div>
    </div>

    <script>
        // --- EXISTING FUNCTIONS ---
        async function sendData() {
            const val = document.getElementById('userInput').value;
            await fetch('http://34.9.202.244:8001/write', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text_entry: val})
            });
            document.getElementById('userInput').value = ''; 
            alert("Sent via POST!");
        }

        async function getData() {
            const response = await fetch('http://34.44.69.44:8002/read');
            const data = await response.json();
            const list = document.getElementById('list');
            list.innerHTML = data.entries.map(item => `<li>${item}</li>`).join('');
        }

        // --- NEW: FETCH PRODUCTS FUNCTION ---
        async function fetchProducts() {
            try {
                // Assuming your 3rd API is on Port 8003
                const response = await fetch('http://34.46.12.67:8003/products');
                const products = await response.json();
                
                const grid = document.getElementById('product-grid');
                grid.innerHTML = ''; // Clear previous

                products.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <img src="${item.image_url || 'https://via.placeholder.com/150'}" alt="Product">
                        <h4>${item.name}</h4>
                        <p>${item.description || 'No description available.'}</p>
                        <p class="price">$${item.price}</p>
                        <button style="width:100%">Add to Cart</button>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error("Could not load products:", error);
                document.getElementById('product-grid').innerHTML = "<p>Failed to load products. Check API 3.</p>";
            }
        }

        // Auto-load products when the page opens
        window.onload = fetchProducts;
    </script>
</body>
</html>
