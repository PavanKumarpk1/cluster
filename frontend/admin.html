<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pro Store Admin Dashboard</title>
    <style>
        :root { --primary: #6f42c1; --secondary: #4a90e2; --danger: #dc3545; --success: #28a745; --dark: #212529; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: #f8f9fa; color: #333; }
        nav { background: var(--dark); color: white; padding: 1rem 2rem; display: flex; gap: 25px; align-items: center; position: sticky; top: 0; z-index: 1000; }
        nav h1 { margin: 0; font-size: 1.2rem; flex-grow: 1; color: var(--secondary); }
        nav a { color: #adb5bd; text-decoration: none; font-weight: 500; cursor: pointer; }
        nav a.active { color: white; border-bottom: 2px solid var(--secondary); }

        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 30px; }
        
        .search-bar { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 8px; margin-bottom: 20px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; border-bottom: 2px solid #eee; color: #666; }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; }
        
        .prod-img { width: 50px; height: 50px; object-fit: contain; border-radius: 6px; background: #f0f0f0; }
        .edit-input { width: 100%; padding: 8px; border: 1px solid var(--secondary); border-radius: 4px; box-sizing: border-box; margin-bottom: 4px; }
        
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; }
        .btn-edit { background: #e7f1ff; color: var(--secondary); }
        .btn-del { background: #fff5f5; color: var(--danger); }
        .btn-save { background: var(--success); color: white; }
        .btn-cancel { background: #6c757d; color: white; }

        .hidden { display: none !important; }
        .action-group { display: flex; gap: 8px; }

        /* Upload Status Styles */
        #uploadStatus { margin-top: 15px; padding: 15px; border-radius: 8px; display: none; }
        .status-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; margin-top: 5px; font-size: 12px; }
    </style>
</head>
<body>

<nav>
    <h1>Store Admin Pro</h1>
    <a onclick="showSection('manage')" id="nav-manage" class="active">Inventory</a>
    <a onclick="showSection('add')" id="nav-add">Add Products</a>
</nav>

<div class="container">
    <div id="section-add" class="card hidden">
        <h2>Manual Entry</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 15px; align-items: end; margin-bottom: 30px;">
            <div><label>Name</label><input type="text" id="p-name" class="edit-input"></div>
            <div><label>Price</label><input type="number" id="p-price" class="edit-input"></div>
            <div><label>Image URL</label><input type="text" id="p-url" class="edit-input"></div>
            <button class="btn btn-save" onclick="manualAdd()">Add Product</button>
        </div>

        <div style="padding-top: 20px; border-top: 1px dashed #ccc;">
            <h3>JSON Bulk Import</h3>
            <input type="file" id="bulkFile" accept=".json">
            <button id="uploadBtn" class="btn" style="background:var(--primary); color:white;">Start Upload</button>
            
            <div id="uploadStatus" class="status-success"></div>
            <div id="errorLog" class="status-error hidden"></div>
        </div>
    </div>

    <div id="section-manage" class="card">
        <input type="text" class="search-bar" id="searchInput" placeholder="Search products..." onkeyup="filterProducts()">
        <table>
            <thead>
                <tr>
                    <th width="80">Image</th>
                    <th>Product Details</th>
                    <th width="120">Price</th>
                    <th width="180">Actions</th>
                </tr>
            </thead>
            <tbody id="product-list"></tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = "http://34.44.69.44:8003/products";
    let allProducts = [];

    function showSection(section) {
        document.getElementById('section-add').classList.toggle('hidden', section !== 'add');
        document.getElementById('section-manage').classList.toggle('hidden', section !== 'manage');
        document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
        document.getElementById(`nav-${section}`).classList.add('active');
        if(section === 'manage') fetchProducts();
    }

    async function fetchProducts() {
        try {
            const res = await fetch(API_URL);
            allProducts = await res.json();
            renderTable(allProducts);
        } catch (e) { console.error(e); }
    }

    function renderTable(data) {
        const tbody = document.getElementById('product-list');
        tbody.innerHTML = data.map((p, index) => `
            <tr id="row-${index}">
                <td><img src="${p.image_url}" class="prod-img" onerror="this.src='https://placehold.co/50x50?text=Error'"></td>
                <td>
                    <div class="view-mode"><strong>${p.name}</strong></div>
                    <div class="edit-mode hidden">
                        <input type="text" class="edit-input" id="edit-name-${index}" value="${p.name}">
                        <input type="text" class="edit-input" id="edit-url-${index}" value="${p.image_url}">
                    </div>
                </td>
                <td>
                    <div class="view-mode">$${p.price}</div>
                    <div class="edit-mode hidden"><input type="number" class="edit-input" id="edit-price-${index}" value="${p.price}"></div>
                </td>
                <td>
                    <div class="view-mode action-group">
                        <button class="btn btn-edit" onclick="toggleEdit(${index}, true)">Edit</button>
                        <button class="btn btn-del" onclick="deleteProduct('${p.name}')">Delete</button>
                    </div>
                    <div class="edit-mode action-group hidden">
                        <button class="btn btn-save" onclick="saveEdit(${index}, '${p.name}')">Save</button>
                        <button class="btn btn-cancel" onclick="toggleEdit(${index}, false)">Cancel</button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    function toggleEdit(index, isEditing) {
        const row = document.getElementById(`row-${index}`);
        row.querySelectorAll('.view-mode').forEach(el => el.classList.toggle('hidden', isEditing));
        row.querySelectorAll('.edit-mode').forEach(el => el.classList.toggle('hidden', !isEditing));
    }

    async function saveEdit(index, oldName) {
        const name = document.getElementById(`edit-name-${index}`).value;
        const price = document.getElementById(`edit-price-${index}`).value;
        const url = document.getElementById(`edit-url-${index}`).value;
        await fetch(`${API_URL}/${encodeURIComponent(oldName)}`, { method: 'DELETE' });
        await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, price: parseInt(price), image_url: url })
        });
        fetchProducts();
    }

    async function deleteProduct(name) {
        if(confirm(`Delete ${name}?`)) {
            await fetch(`${API_URL}/${encodeURIComponent(name)}`, { method: 'DELETE' });
            fetchProducts();
        }
    }

    async function manualAdd() {
        const name = document.getElementById('p-name').value;
        const price = document.getElementById('p-price').value;
        const url = document.getElementById('p-url').value;
        await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, price: parseInt(price), image_url: url })
        });
        showSection('manage');
    }

    // --- BULK UPLOAD WITH ERROR LOGGING ---
    document.getElementById('uploadBtn').addEventListener('click', async () => {
        const fileInput = document.getElementById('bulkFile');
        const statusBox = document.getElementById('uploadStatus');
        const errorLog = document.getElementById('errorLog');
        
        if (!fileInput.files[0]) return alert("Select file");

        const reader = new FileReader();
        reader.onload = async (e) => {
            const products = JSON.parse(e.target.result);
            let successCount = 0;
            let failures = [];

            statusBox.style.display = "block";
            statusBox.innerText = "Uploading... please wait.";
            errorLog.classList.add('hidden');
            errorLog.innerHTML = "<strong>Failed Items:</strong><br>";

            for (const p of products) {
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(p)
                    });
                    if (res.ok) successCount++;
                    else failures.push(p.name);
                } catch (err) { failures.push(p.name); }
            }

            statusBox.innerText = `Finished! Success: ${successCount} | Failed: ${failures.length}`;
            if (failures.length > 0) {
                errorLog.classList.remove('hidden');
                errorLog.innerHTML += failures.join(", ");
            }
        };
        reader.readAsText(fileInput.files[0]);
    });

    function filterProducts() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        renderTable(allProducts.filter(p => p.name.toLowerCase().includes(q)));
    }

    fetchProducts();
</script>
</body>
</html>
