apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: app-health-config
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    # This forces Google to accept whatever status code your container roots return 
    # while boot-strapping rather than shutting down your ports completely.
    requestPath: /
