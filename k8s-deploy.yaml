# --- API 1 ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-api-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-1
  template:
    metadata:
      labels:
        app: api-1
    spec:
      containers:
      - name: api-1
        image: paavan24/api_1:latest # Jenkins will update this tag
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-1-service
spec:
  selector:
    app: api-1
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP # Internal only

