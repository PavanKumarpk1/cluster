# --- API 3 (Port 8003) - UPDATED WITH DATA INJECTION ---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-api-3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-3
  template:
    metadata:
      labels:
        app: api-3
    spec:
      initContainers:
      - name: data-provider
        image: paavan24/products:latest
        imagePullPolicy: Always
        command: 
        - /bin/sh
        - -c
        - |
          cp /data/products.json /shared/products.json
          chmod 666 /shared/products.json
        volumeMounts:
        - name: product-data-volume
          mountPath: /shared

      containers:
      - name: api-3
        image: paavan24/api_3:latest # <-- Make sure to use the newly built image version
        imagePullPolicy: Always
        ports:
        - containerPort: 8003
        volumeMounts:
        # FIX: Mount the whole directory to /app/data so it does not overwrite main.py
        - name: product-data-volume
          mountPath: /app/data

      volumes:
      - name: product-data-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-3-service
  annotations:
    cloud.google.com/backend-config: '{"ports": {"80": "app-health-config"}}'
spec:
  type: ClusterIP
  selector:
    app: api-3
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8003
# --- FRONTEND (UI) ---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
      - name: ui
        image: paavan24/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: ui-service
  annotations:
    cloud.google.com/backend-config: '{"ports": {"80": "app-health-config"}}'
spec:
  type: ClusterIP
  selector:
    app: ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
