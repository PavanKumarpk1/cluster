# --- API 1 (Port 8001) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-api-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-1
  template:
    metadata:
      labels:
        app: api-1
    spec:
      containers:
      - name: api-1
        image: paavan24/api_1:latest 
        ports:
        - containerPort: 8001 # Matches your app code
---
apiVersion: v1
kind: Service
metadata:
  name: api-1-service
spec:
  type: LoadBalancer # Changed to LoadBalancer for External IP
  selector:
    app: api-1
  ports:
    - protocol: TCP
      port: 80         # Port exposed to the Frontend
      targetPort: 8001 # Routes to the app's internal port

