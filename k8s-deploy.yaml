# --- API 1 (Port 8001) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-api-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-1
  template:
    metadata:
      labels:
        app: api-1
    spec:
      containers:
      - name: api-1
        image: paavan24/api_1:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: api-1-service
  annotations:
    cloud.google.com/backend-config: '{"ports": {"80": "app-health-config"}}'
spec:
  type: ClusterIP
  selector:
    app: api-1
  ports:
    - protocol: TCP
      port: 80         
      targetPort: 8001

