# --- API 3 (Port 8003) - UPDATED WITH DATA INJECTION ---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-api-3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-3
  template:
    metadata:
      labels:
        app: api-3
    spec:
      # 1. ADDED: This container boots up first and places your file into the shared path
      initContainers:
      - name: data-provider
        image: paavan24/products:latest
        imagePullPolicy: Always # The new data image built by Jenkins
        command: ["cp", "/data/products.json", "/shared/products.json"]
        volumeMounts:
        - name: product-data-volume
          mountPath: /shared

      containers:
      - name: api-3
        image: paavan24/api_3:40
        imagePullPolicy: Always
        ports:
        - containerPort: 8003
        # 2. ADDED: Mount the shared file right into your app working directory
        volumeMounts:
        - name: product-data-volume
          mountPath: /app/products.json
          subPath: products.json

      # 3. ADDED: Shared temporary volume layer
      volumes:
      - name: product-data-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-3-service
spec:
  type: LoadBalancer
  selector:
    app: api-3
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8003

# --- FRONTEND (UI) ---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
      - name: ui
        image: paavan24/frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: ui-service
spec:
  type: LoadBalancer
  selector:
    app: ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
